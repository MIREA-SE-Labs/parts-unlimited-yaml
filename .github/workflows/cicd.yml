   name: CI/CD

   on:
     push:
       branches: [main]
     workflow_dispatch:

   env:
     NODE_VERSION: 24

   permissions:
     contents: read

   concurrency:
     group: pages
     cancel-in-progress: false

   jobs:
     build:
       name: Build
       runs-on: ubuntu-latest
       steps:
         - name: Получить исходники
           uses: actions/checkout@v7

         - name: Установить Node.js
           uses: actions/setup-node@v7
           with:
             node-version: ${{ env.NODE_VERSION }}
             cache: npm

         - name: Восстановить зависимости
           run: npm ci

         - name: Тесты
           run: npm test

         - name: Сборка
           run: npm run build -- --base=/${{ github.event.repository.name }}/

         - name: Опубликовать артефакт сборки
           uses: actions/upload-artifact@v7
           with:
             name: drop
             path: dist/

     deploy:
       name: Deploy
       needs: build
       runs-on: ubuntu-latest
       permissions:
         pages: write
         id-token: write
       environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
       steps:
         - name: Загрузить артефакт сборки
           uses: actions/download-artifact@v8
           with:
             name: drop
             path: drop

         - name: Подготовить артефакт для Pages
           uses: actions/upload-pages-artifact@v5
           with:
             path: drop

         - name: Развернуть на GitHub Pages
           id: deployment
           uses: actions/deploy-pages@v5
