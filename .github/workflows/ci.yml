   name: CI

   on:
     push:
       branches: [main]
     pull_request:
       branches: [main]
     workflow_dispatch:

   jobs:
     build:
       runs-on: [self-hosted, macOS, lab-ci]
       timeout-minutes: 15

       steps:
         - name: Получить исходники
           uses: actions/checkout@v7

         - name: Установить Node.js
           uses: actions/setup-node@v7
           with:
             node-version: ${{ vars.NODE_VERSION }}
             cache: npm

         - name: Восстановить зависимости
           run: npm ci

         - name: Сборка
           run: npm run build

         - name: Тесты
           run: npm test

         - name: Опубликовать артефакт
           uses: actions/upload-artifact@v7
           with:
             name: web-dist
             path: dist/
             retention-days: 7
